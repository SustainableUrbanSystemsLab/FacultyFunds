{% load ledger_tags %}{% with b=line|budget_bar %}{% if b.empty %}<span class="small muted">no budget</span>{% else %}<svg class="bar{% if b.over %} bar-over{% endif %}" viewBox="0 0 100 10" preserveAspectRatio="none" role="img" aria-label="{{ line.pct_spent|percent }} spent"><rect class="bar-bg" width="100" height="10"/><rect class="bar-committed" x="{{ b.committed_x }}" width="{{ b.committed }}" height="10"/><rect class="bar-spent" width="{{ b.spent }}" height="10"/></svg>{% endif %}{% endwith %}
