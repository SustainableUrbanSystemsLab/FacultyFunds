<div class="bulkbar">
  <label class="inline"><input type="checkbox" data-select-all> All</label>
  <label class="inline">Fund {{ bulk_form.worktag }}</label>
  <label class="inline">Category {{ bulk_form.category }}</label>
  <button class="btn btn-small" type="submit" name="action" value="assign">Apply to selected</button>
  <button class="btn btn-small btn-danger" type="submit" name="action" value="delete" data-confirm="Delete the selected transactions?">Delete selected</button>
</div>
