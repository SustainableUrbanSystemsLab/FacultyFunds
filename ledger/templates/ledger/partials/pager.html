{% load ledger_tags %}{% if page.has_other_pages %}
<nav class="pager" aria-label="Pages">
  {% if page.has_previous %}<a class="btn btn-small" href="{% query_with page=page.previous_page_number %}">← Previous</a>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-small" href="{% query_with page=page.next_page_number %}">Next →</a>{% endif %}
</nav>
{% endif %}
