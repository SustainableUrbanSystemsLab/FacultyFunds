<figure class="chart">
  <figcaption>
    <strong>Cumulative spending</strong>
    <span class="legend">
      <span><i class="key key-actual"></i>Actual</span>
      <span><i class="key key-projected"></i>Projected</span>
      <span><i class="key key-budget"></i>Budget</span>
      <span><i class="key key-today"></i>Today</span>
    </span>
  </figcaption>
  <div class="chart-scroll">
    <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" class="burn" role="img" aria-label="Cumulative spending compared with budget">
      {% for y, label in chart.y_ticks %}
        <line class="grid" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ y }}" y2="{{ y }}"/>
        <text class="tick" x="{{ chart.plot_left|add:'-8' }}" y="{{ y }}" text-anchor="end" dominant-baseline="middle">{{ label }}</text>
      {% endfor %}
      {% for x, label in chart.x_ticks %}
        <text class="tick" x="{{ x }}" y="{{ chart.plot_bottom|add:'20' }}" text-anchor="middle">{{ label }}</text>
      {% endfor %}
      {% if chart.budget_y is not None %}<line class="budget" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ chart.budget_y }}" y2="{{ chart.budget_y }}"/>{% endif %}
      {% if chart.today_x is not None %}<line class="today" x1="{{ chart.today_x }}" x2="{{ chart.today_x }}" y1="8" y2="{{ chart.plot_bottom }}"/>{% endif %}
      {% if chart.projected_path %}<path class="projected" d="{{ chart.projected_path }}"/>{% endif %}
      {% if chart.actual_path %}<path class="actual" d="{{ chart.actual_path }}"/>{% endif %}
    </svg>
  </div>
</figure>
