{% extends "base.html" %}
{% block title %}Confirm{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ title }}</h1>
  {% if detail %}<p>{{ detail }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    <div class="actions">
      <button class="btn btn-danger" type="submit">{{ button }}</button>
      <a class="btn btn-ghost" href="{{ cancel_url }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
