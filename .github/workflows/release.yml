name: Release

# On every push to main: run the tests, work out the next version from the commit messages
# (scripts/release.py), tag it and publish a GitHub release when there is one, then build and push
# the Docker image with that version baked in.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.next.outputs.new_version }}
      app_version: ${{ steps.next.outputs.app_version }}
      minor: ${{ steps.next.outputs.minor }}
      commit: ${{ steps.next.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the next version
        id: next
        run: python3 scripts/release.py --github-output "$GITHUB_OUTPUT" --notes release-notes.md
      - name: Tag and publish the release
        if: steps.next.outputs.new_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.next.outputs.new_version }}
        run: |
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
          gh release create "v$NEW_VERSION" --title "v$NEW_VERSION" --notes-file release-notes.md --verify-tag

  image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.app_version }},enable=${{ !contains(needs.version.outputs.app_version, '+') }}
            type=raw,value=${{ needs.version.outputs.minor || 'none' }},enable=${{ needs.version.outputs.minor != '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.app_version }}
            APP_COMMIT=${{ needs.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
